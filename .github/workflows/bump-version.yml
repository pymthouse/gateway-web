name: bump-version

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to bump (`gateway-web` tags vX; `gateway-stream` tags stream-vX)
        required: true
        default: gateway-web
        type: choice
        options:
          - gateway-web
          - gateway-stream
      version:
        description: >
          Semver bump keyword (patch, minor, major, prerelease, …) or an exact
          version (e.g. 2.0.0 or 1.0.0-rc.1). Passed to `npm version`.
        required: true
        default: patch
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          if [ "${{ inputs.package }}" = "gateway-stream" ]; then
            npm ci
          else
            npm ci --ignore-scripts
          fi
      - name: Build core types for stream workspace
        if: inputs.package == 'gateway-stream'
        run: npm run build --workspace @pymthouse/gateway-web
      - run: npm test --workspace @pymthouse/${{ inputs.package }}
      - run: npm run build --workspace @pymthouse/${{ inputs.package }}
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump package version
        env:
          VERSION_BUMP: ${{ inputs.version }}
          PKG: ${{ inputs.package }}
        run: |
          npm version "$VERSION_BUMP" --workspace "@pymthouse/${PKG}" --no-git-tag-version
          VERSION=$(node -p "require('./packages/${PKG}/package.json').version")
          if [ "$PKG" = "gateway-stream" ]; then
            TAG="stream-v${VERSION}"
          else
            TAG="v${VERSION}"
          fi
          git add "packages/${PKG}/package.json" package-lock.json
          git commit -m "chore: release ${TAG}"
          git tag "$TAG"
          echo "Created ${TAG}"
      - name: Push branch and tag
        run: |
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin --tags
