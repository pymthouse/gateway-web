# Provenance: package.json "repository.url" must be the same GitHub repo this
# workflow runs in, or npm returns E422 when verifying the sigstore bundle.
#
# npm auth: Trusted Publishing (OIDC). Configure on npmjs.com for this repo and
# workflow filename `release.yml`. Do not set secrets.NPM_TOKEN on publish — it
# overrides OIDC and can cause EOTP. See docs/RELEASING.md.
name: release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          # Do not set registry-url: setup-node then writes
          # _authToken=${NODE_AUTH_TOKEN} into .npmrc and npm skips OIDC
          # (E404 / ENEEDAUTH). See npm/documentation#1960.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify package.json repository matches this repo
        run: |
          # Strip the optional `git+` prefix so both `https://…` and
          # `git+https://…` repository.url formats satisfy the provenance check.
          REPO_URL=$(node -p "require('./package.json').repository.url.replace(/^git\\+/, '')")
          EXPECTED="https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$REPO_URL" != "$EXPECTED" ]; then
            echo "::error::package.json repository.url must be ${EXPECTED} for npm provenance (got ${REPO_URL})"
            exit 1
          fi
      - name: Install npm CLI for trusted publishing
        run: npm install -g npm@11.5.1 --ignore-scripts
      - name: Publish to npm via OIDC (trusted publishing)
        # Use npm CLI (not yarn/pnpm publish): OIDC is implemented in npm.
        # Do not set NODE_AUTH_TOKEN / registry-url — those force classic auth
        # and skip trusted publishing. Provenance is automatic with OIDC.
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset; id-token: write is required for OIDC."
            exit 1
          fi
          echo "npm $(npm -v); OIDC request URL is set"
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published ${PKG}@${VERSION}; skipping npm publish."
            exit 0
          fi
          # Prerelease versions (e.g. 0.1.0-rc.1) must publish under a non-`latest`
          # dist-tag so `npm install <pkg>` keeps resolving the stable release.
          case "$VERSION" in
            *-*) PUBLISH_ARGS="--access public --tag rc" ;;
            *)   PUBLISH_ARGS="--access public" ;;
          esac
          # npm 11.5.x can exit E401 ("token is invalid") after a successful OIDC
          # PUT. Retry, and treat an already-published version as success.
          for attempt in 1 2 3; do
            if npm publish $PUBLISH_ARGS; then
              exit 0
            fi
            echo "publish attempt ${attempt} failed; checking registry"
            if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "Already published ${PKG}@${VERSION}; treating as success."
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on ${GITHUB_REPOSITORY}; skipping create."
            exit 0
          fi
          # Mark prerelease versions (containing a hyphen) as GitHub prereleases.
          # `case` avoids a non-zero `grep` exit tripping `set -e` in $( … ).
          PRERELEASE_FLAG=""
          case "$VER" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --title "${PKG} v${VER}" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG
