sonar.projectKey=pymthouse_gateway-web
sonar.sources=packages/gateway-web/src,packages/gateway-stream/src
sonar.tests=packages/gateway-web/tests,packages/gateway-stream/tests
# NOTE: this project is analysed by SonarCloud Automatic Analysis (the
# sonarqubecloud GitHub App; there is no scanner step in ci.yml), and Automatic
# Analysis does not read this file -- which is why tests and scripts are analysed
# despite sonar.sources below. Scope has to be set in the SonarCloud UI under
# Administration > Analysis Scope, or by moving to a CI-based scan. The settings
# here are kept correct for that day.
#
# `scripts/**` only matched the pre-monorepo layout; scripts now live under
# packages/*/scripts, so keep this pattern depth-independent.
sonar.exclusions=**/scripts/**,**/dist/**,**/node_modules/**
